name: Cleanup Old Workflow Runs

on:
  schedule:
    - cron: '0 3 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ 安装工具
      - name: Setup tools
        run: |
          sudo apt update
          sudo apt install -y gh jq

      # 3️⃣ 调试 GitHub CLI
      - name: Debug GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "GitHub CLI Version:"
          gh --version
          echo
          echo "Current workflow:"
          echo "${{ github.workflow }}"
          echo
          echo "Repository:"
          echo "${{ github.repository }}"

      # 4️⃣ 删除旧 Workflow Runs（保留最新一次）
           - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🗑️ Deleting all workflow runs..."

          page=1

          while true; do
            runs=$(gh api \
              "repos/${{ github.repository }}/actions/runs?per_page=100&page=$page" \
              --jq '.workflow_runs[] | select(.status != "in_progress") | .id')

            if [ -z "$runs" ]; then
              echo "No more workflow runs found."
              break
            fi

            echo "Processing page $page..."

            while read -r run_id; do
              [ -z "$run_id" ] && continue

              echo "Deleting run: $run_id"

              gh api \
                -X DELETE \
                "repos/${{ github.repository }}/actions/runs/$run_id" \
                || true
            done <<< "$runs"

            page=$((page + 1))
          done

          echo "✅ Cleanup finished."

      # 5️⃣ 清理 Artifacts 并生成日志
      - name: Clean artifacts + generate log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📦 Cleaning artifacts older than 7 days..."

          cutoff=$(date -u -d "7 days ago" +%s)

          LOG_BODY=""

          touch cleanup-log.txt

          artifacts=$(gh api \
            repos/${{ github.repository }}/actions/artifacts \
            --paginate \
            --jq '.artifacts[] | "\(.id) \(.created_at)"')

          if [ -z "$artifacts" ]; then
            LOG_BODY="• No artifacts found"
          else
            while read -r id created_at; do
              created_ts=$(date -d "$created_at" +%s)

              if [ "$created_ts" -lt "$cutoff" ]; then
                echo "Deleting artifact $id"
                gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id
                LOG_BODY="$LOG_BODY\n• Deleted artifact $id"
              fi
            done <<< "$artifacts"
          fi

          echo -e "$LOG_BODY" > cleanup-log.txt

      # 6️⃣ 更新 README
      - name: Update README
        run: |
          TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')

          {
            echo "### 🧹 Cleanup Log ($TIME)"
            echo
            cat cleanup-log.txt
          } > README.md

      # 7️⃣ 提交更改
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🧹 Cleanup workflow runs & artifacts log"
            git push
          fi