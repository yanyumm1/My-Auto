name: aida Server Auto Addtime

on:
  schedule:
    - cron: '2 */10 * * *'
  workflow_dispatch:

jobs:
  run-addtime:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下载私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/aida-auto
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 移动脚本到工作目录
        run: mv private/aida_renew.py aida_renew.py

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install DrissionPage requests DataRecorder DownloadKit FlowViewer lxml websocket-client psutil pyvirtualdisplay

          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser curl

      - name: 🚀 启动 sing-box（可选）
        env:
          VLINK: ${{ secrets.AIDA_LINK }}
        run: |
          set +e

          if [ -n "$VLINK" ]; then
            echo "🟢 检测到 VLINK，启动 sing-box"

            curl -L -o sb https://amd64.ssss.nyc.mn/sb
            curl -L -o vlink_to_sb.py https://raw.githubusercontent.com/liveqte/jupyter-notebook-deployed/refs/heads/main/vlink_to_sb.py

            chmod +x sb

            python vlink_to_sb.py "$VLINK" > v.json
            if [ $? -ne 0 ]; then
              echo "❌ vlink 转换失败，跳过代理"
              exit 0
            fi

            nohup ./sb run -c v.json > sb.log 2>&1 &
            sleep 5

            echo "🌐 测试代理..."
            curl -s -x http://127.0.0.1:1080 https://api.ipify.org \
            | sed 's/\([0-9]*\.[0-9]*\.[0-9]*\.\)[0-9]*/\1**/g' || echo "⚠️ 代理不可用"

          else
            echo "⚪ 未设置 VLINK，跳过代理"
          fi

      - name: ▶️ 运行续期脚本
        env:
          AIDA_EMAIL: ${{ secrets.AIDA_EMAIL }}
          AIDA_PASSWORD: ${{ secrets.AIDA_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY: socks5://127.0.0.1:1080
        run: |
          xvfb-run -a python aida_renew.py