name: 56IDC Auto Login

on:
  schedule:
    # 每月 13 / 27 号
    # UTC 19:10（北京时间 03:10）
    - cron: '10 19 13,27 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # =========================
      # 📥 检出私库 56idc
      # =========================
      - name: Checkout private repo (56idc)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/56idc
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      # =========================
      # 🐍 Python
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # =========================
      # 📦 系统依赖
      # =========================
      - name: Install system dependencies
        working-directory: scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            fonts-noto-cjk \
            fonts-dejavu-core \
            python3-tk \
            python3-dev \
            curl

      # =========================
      # 📡 安装 Hysteria2
      # =========================
      - name: Install Hysteria2
        working-directory: scripts
        run: |
          curl -L -o hysteria \
            https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64
          chmod +x hysteria
          sudo mv hysteria /usr/local/bin/hysteria
          hysteria version

      # =========================
      # 📦 Python 依赖
      # =========================
      - name: Install Python dependencies
        working-directory: scripts
        run: |
          python -m pip install --upgrade pip
          pip install -q \
            seleniumbase \
            pyvirtualdisplay \
            requests

      # =========================
      # 🚀 执行登录脚本
      # =========================
      - name: Run 56IDC login script
        working-directory: scripts
        env:
          IDC56_BATCH: ${{ secrets.IDC56_BATCH }}
        run: |
          python 56idc_login.py
